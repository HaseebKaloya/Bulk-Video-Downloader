[package]
name = "bulk-video-downloader"
version = "0.1.0"
description = "Bulk Video Downloader Desktop Application"
authors = ["Haseeb Kaloya <contact.haseebkaloya@gmail.com>"]
edition = "2021"

[lib]
name = "bulk_video_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"
sha2 = "0.10"
regex = "1"
dirs = "5"
sysinfo = "0.33"
futures-util = "0.3"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
